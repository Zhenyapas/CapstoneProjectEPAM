<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YO!APARTMENTS - Нерухомість</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Хедер -->
        <header class="header">
            <div class="header__left">
                <!-- <a href="#" class="logo">YO!<span>APARTMENTS</span></a> -->
                <div class="logo"><img class="logo__svg"src="img/logo2.svg"></div>
            </div>
            <div class="header__right">
                <div class="header__toggle">
                    <button class="header__toggle__btn header__toggle__btn--disabled">RENT</button>
                    <button class="header__toggle__btn header__toggle__btn--active">SELL</button>
                </div>
                <div class="header__city">
                    <span>CITY:</span>
                    <span class="city-value">KYIV</span>
                </div>
            </div>
        </header>

        <!-- Основний контент -->
        <main class="main-content">
            <!-- Ліва колонка з списком -->
            <section class="property-column">
                <div class="property-column__header">
                    <div class="search-container">
                        <input type="text" class="search-placeholder" placeholder="Search Anything...">
                        <button class="search-button">
                          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                          </svg>
                        </button>
                      </div>
                    <div  class="filter-placeholder" >
                        <button class="filter-placeholder__button filter-placeholder__button--active"> House</button>
                        <button class="filter-placeholder__button filter-placeholder__button--disabled"> Apartment</button>
                    </div>
                </div>
            </section>
            
            <!-- Права колонка з картою -->
            <section class="map-column">
                <div class="map-placeholder">Google Map will be here</div>
            </section>
        </main>
    </div>
</body>
</html>
