<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YO!APARTMENTS - Нерухомість</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app-container">

        <header class="header">
            <div class="header__left">
 
                <div class="logo"><img class="logo__svg"src="img/logo2.svg"></div>
            </div>
            <div class="header__right">
                
                <div class="header__toggle">
                    <button class="header__toggle__btn header__toggle__btn--disabled">RENT</button>
                    <button class="header__toggle__btn header__toggle__btn--active">SALE</button>
                </div>

                <div class="city-selector">
                    <div class="city-selector__selected">
                      <span class="city-selector__current" id="current-city">KYIV</span>
                      <div class="city-selector__arrow"></div>
                    </div>
                    <div class="city-selector__dropdown">
                      <ul class="city-selector__list">
                        <li class="city-selector__item city-selector__item--active" data-value="kyiv">KYIV</li>
                        <li class="city-selector__item" data-value="odessa">ODESSA</li>
                        <li class="city-selector__item" data-value="lviv">LVIV</li>
                        <li class="city-selector__item" data-value="kharkiv">KHARKIV</li>
                        <!-- Додайте більше міст, якщо потрібно -->
                      </ul>
                    </div>
                </div>
            </div>
        </header>


        <main class="main-content">

            <section class="property-column">
                <div class="property-column__header">
                    <div class="search-container">
                        <input type="text" class="search-placeholder" placeholder="Search by adress">
                        <button class="search-button">
                          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                          </svg>
                        </button>
                      </div>
                    <div  class="filter-placeholder" >
                        <button class="filter-placeholder__button filter-placeholder__button--disabled"> House</button>
                        <button class="filter-placeholder__button filter-placeholder__button--active"> Apartment</button>
                    </div>
                </div>

                <div class="property-count">
                    <p class="property-count__text">There are <span class="property-count__number">0</span> properties let's take a look!</p>
                </div>

                <div class="property-list"></div>

                <div class="property-paginator"></div>

            </section>
            

            <section class="map-column">
                <div id="map" class="map-placeholder">Google Map will be here</div>
            </section>
        </main>
    </div>
</body>
</html>
